name: test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 测试都是纯函数级的，不需要她的生活目录 / 钥匙 / 网络
      - name: 测试（25 套）
        run: node tools/run-tests.mjs

      # 体检依赖她的真实数据（life/ secrets/），在 CI 里会大量告警，所以只跑一次"能不能加载"
      - name: 冒烟（模块能加载）
        run: node -e "import('./lib/derive.mjs').then(m=>console.log('derive ok', typeof m.derive))"